<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MÀN HÌNH TRÌNH CHIẾU — RUNG CHUÔNG VÀNG</title>
  <link rel="stylesheet" href="/assets/css/arena_theme.css">
  <style>
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      background: var(--c-dark);
    }
    .stage-container {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 75px 1fr 115px;
      padding: 12px 24px;
      gap: 12px;
      position: relative;
    }

    /* Top Stage Header */
    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      border-radius: var(--radius-base);
      background: var(--c-dark-surface);
      border: 2px solid var(--c-primary);
    }
    .stage-logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .stage-logo-icon {
      width: 32px;
      height: 32px;
      stroke: var(--c-surface);
    }
    .stage-logo-text {
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }
    .stage-round-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 22px;
      border-radius: var(--radius-base);
      background: var(--c-neutral);
      border: 1.5px solid var(--c-surface);
      font-size: 1.25rem;
      color: var(--c-surface);
    }
    .stage-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Main Stage Arena */
    .stage-arena {
      position: relative;
      border-radius: var(--radius-base);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 20px 24px;
      background: var(--c-dark-card);
      border: 2px solid var(--c-primary);
    }

    /* 5 Teams Podium Bar */
    .podium-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      align-items: center;
    }
    .team-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: var(--radius-base);
      background: var(--c-dark-surface);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      transition: var(--spring-transition);
      position: relative;
      overflow: hidden;
    }
    .team-card.active-turn {
      transform: translateY(-8px) scale(1.03);
      border: 2.5px solid var(--c-surface);
      background: var(--c-neutral);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
    }
    .team-card.locked {
      opacity: 0.45;
      filter: grayscale(0.7);
    }
    .team-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .team-score {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--c-surface);
    }

    /* --- LOBBY STAGE --- */
    .lobby-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      max-width: 900px;
    }
    .lobby-title {
      font-size: 3.5rem;
      line-height: 1.1;
    }
    .lobby-sub {
      font-size: 1.5rem;
      color: var(--c-surface);
    }
    .lobby-qr-box {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 20px 30px;
      border-radius: var(--radius-base);
      background: var(--c-dark-surface);
      border: 2px solid var(--c-surface);
    }
    .lobby-qr-img {
      width: 140px;
      height: 140px;
      border-radius: 6px;
      background: white;
      padding: 6px;
    }

    /* --- ROUND 1 QUESTION VIEW --- */
    .q-box {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .q-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .q-topic-tag {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--c-tertiary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .q-timer-badge {
      font-family: var(--font-mono);
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--c-surface);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 18px;
      border-radius: var(--radius-base);
      background: var(--c-neutral);
      border: 1.5px solid var(--c-primary);
    }
    .q-card {
      padding: 28px 36px;
      border-radius: var(--radius-base);
      font-size: 1.75rem;
      line-height: 1.35;
      background: var(--c-dark-surface);
      border: 2px solid var(--c-surface);
      color: #ffffff;
      text-align: center;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.6);
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .opt-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      border-radius: var(--radius-base);
      background: var(--c-dark-surface);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      font-size: 1.3rem;
      transition: var(--spring-transition);
      position: relative;
    }
    .opt-card .opt-letter {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-base);
      background: var(--c-neutral);
      border: 2px solid var(--c-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--c-surface);
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .opt-card.selected {
      border-color: var(--c-surface);
      background: rgba(255, 215, 0, 0.18);
    }
    .opt-card.correct-answer {
      border-color: var(--c-tertiary);
      background: rgba(194, 247, 0, 0.22);
    }
    .opt-card.wrong-answer {
      border-color: var(--c-secondary);
      background: rgba(255, 29, 142, 0.22);
      opacity: 0.7;
    }

    /* Buzzer Notification Banner */
    .buzzer-alert-banner {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 32px;
      border-radius: var(--radius-base);
      background: var(--c-neutral);
      border: 2.5px solid var(--c-surface);
      box-shadow: 0 0 35px rgba(255, 95, 0, 0.8);
      animation: alertSlideDown 0.4s ease-out;
      z-index: 100;
    }
    @keyframes alertSlideDown {
      from { transform: translate(-50%, -40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    /* Explanation Overlay */
    .explanation-overlay {
      position: absolute;
      inset: 20px;
      background: rgba(18, 7, 34, 0.97);
      border-radius: var(--radius-base);
      border: 2px solid var(--c-surface);
      padding: 35px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 90;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    /* --- ROUND 2 PUZZLE STAGE --- */
    .r2-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    .r2-topbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      border-radius: var(--radius-base);
      background: var(--c-dark-surface);
      border: 1.5px solid var(--c-surface);
      gap: 12px;
      flex-wrap: wrap;
    }
    .r2-split-layout {
      width: 100%;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      align-items: start;
    }
    .puzzle-board-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: var(--radius-base);
      overflow: hidden;
      border: 3px solid var(--c-surface);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
    }
    .puzzle-board-large {
      max-width: 680px;
      margin: 10px auto;
    }
    .puzzle-bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .puzzle-grid {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 3px;
      background: rgba(18, 7, 34, 0.6);
    }
    .puzzle-tile {
      position: relative;
      background: linear-gradient(135deg, var(--c-dark-surface) 0%, var(--c-neutral) 100%);
      border: 2px solid var(--c-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .puzzle-tile.active-piece {
      border: 3.5px solid var(--c-surface);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.85);
      animation: bellPulse 1.2s infinite;
    }
    .puzzle-tile.unlocked {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85) rotateY(90deg);
    }
    .puzzle-tile-num {
      font-size: 2.5rem;
      color: var(--c-surface);
      text-shadow: 2px 2px 0px var(--c-neutral);
    }
    .puzzle-tile-label {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--c-tertiary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* --- ROUND 3 WAGER VIEW --- */
    .r3-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 24px;
    }
    .r3-timer-circle {
      width: 130px;
      height: 130px;
      border-radius: var(--radius-base);
      background: var(--c-neutral);
      border: 3px solid var(--c-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 4rem;
      font-weight: 700;
      color: var(--c-surface);
      box-shadow: 0 0 30px rgba(255, 95, 0, 0.6);
    }
    .wagers-table {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    .wager-col {
      padding: 20px 14px;
      border-radius: var(--radius-base);
      background: var(--c-dark-surface);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .wager-amount {
      font-family: var(--font-mono);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--c-surface);
    }

    /* --- FINALE PODIUM --- */
    .podium-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }
    .champion-trophy-img {
      width: 220px;
      height: 220px;
      object-fit: contain;
      filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.9));
      animation: bellPulse 2s infinite ease-in-out;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="arena-bg">
    <div class="particles-layer"></div>
  </div>

  <div class="stage-container">
    <!-- Top Header Bar -->
    <header class="stage-header">
      <div class="stage-logo">
        <svg class="ui-icon stage-logo-icon" viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <div>
          <h1 class="stage-logo-text electric-heading">RUNG CHUÔNG VÀNG</h1>
          <p style="font-size: 0.8rem; color: var(--c-surface); font-family: var(--font-mono);">
            PSICODÉLICO ANOS 60 • RUNG CHUÔNG VÀNG 5 ĐỘI
          </p>
        </div>
      </div>

      <!-- Current Round Badge -->
      <div class="stage-round-pill" id="stageRoundBadge">
        <span id="roundTitle">PHÒNG CHỜ KHAI MẠC</span>
      </div>

      <!-- Controls -->
      <div class="stage-controls">
        <button class="btn btn-ghost" onclick="toggleAudio()" id="audioBtn" style="padding: 6px 14px; font-size: 0.9rem;">
          <svg class="ui-icon" id="audioIcon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          <span id="audioLabel">Âm Thanh: Bật</span>
        </button>
        <button class="btn btn-ghost" onclick="toggleFullscreen()" style="padding: 6px 14px; font-size: 0.9rem;">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
          <span>Toàn Màn Hình</span>
        </button>
      </div>
    </header>

    <!-- Center Stage Area -->
    <main class="stage-arena" id="mainArena">
      <!-- Populated dynamically -->
    </main>

    <!-- Bottom 5-Team Live Scoreboard -->
    <footer class="podium-bar" id="teamsPodiumBar">
      <!-- 5 Team cards populated dynamically -->
    </footer>
  </div>

  <!-- Buzzer Notification Alert Floating Banner -->
  <div id="buzzerAlert" class="buzzer-alert-banner" style="display: none;">
    <svg class="ui-icon" style="width: 32px; height: 32px; stroke: var(--c-surface);" viewBox="0 0 24 24">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <div>
      <h3 id="buzzerTeamName" style="font-size: 1.4rem; color: var(--c-surface);">ĐỘI BẤM CHUÔNG!</h3>
      <p id="buzzerDetails" style="font-size: 0.85rem; color: #cbd5e1; font-family: var(--font-mono);">Đang giữ quyền trả lời (45 giây)</p>
    </div>
  </div>

  <!-- Vendor Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/assets/vendor/confetti.browser.js"></script>
  <script src="/assets/js/sound_engine.js"></script>

  <script>
    const socket = io();
    let currentGameState = null;
    let dynamicQrUrl = null;
    let dynamicPlayerUrl = window.location.origin + '/player';

    function fetchDynamicQr() {
      fetch(`/api/player-qr?origin=${encodeURIComponent(window.location.origin)}`)
        .then(r => r.json())
        .then(data => {
          if (data && data.qrUrl) {
            dynamicQrUrl = data.qrUrl;
            dynamicPlayerUrl = data.playerUrl;
            const img = document.getElementById('lobbyQrImage');
            if (img) img.src = dynamicQrUrl;
            const code = document.getElementById('lobbyPlayerUrlText');
            if (code) code.innerText = dynamicPlayerUrl;
          }
        })
        .catch(e => console.log('Dynamic QR fetch error:', e));
    }
    fetchDynamicQr();

    function toggleAudio() {
      const isMuted = window.quizSound.toggleMute();
      const label = document.getElementById('audioLabel');
      const icon = document.getElementById('audioIcon');
      if (isMuted) {
        label.innerText = 'Âm Thanh: Tắt';
        icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
      } else {
        label.innerText = 'Âm Thanh: Bật';
        icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen().catch(err => console.log(err));
      }
    }

    socket.on('play_sound', (name) => {
      if (window.quizSound) window.quizSound.playSound(name);
      if (name === 'victory') launchConfetti();
    });

    function launchConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 150,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#FF5F00', '#FF1D8E', '#C2F700', '#4700A5', '#FFD700', '#A020F0']
        });
      }
    }

    function handleIncomingProjectorState(state) {
      if (!state) return;
      currentGameState = state;
      renderStage(state);
      renderPodiumBar(state);
    }

    socket.on('game_state', handleIncomingProjectorState);
    socket.on('gameState', handleIncomingProjectorState);

    // Initial state fetch so projector renders immediately without delay
    fetch('/api/state')
      .then(r => r.json())
      .then(st => handleIncomingProjectorState(st))
      .catch(() => {});

    socket.on('turn_timer_tick', ({ timeLeft }) => {
      const timerEl = document.getElementById('qTimerDisplay');
      if (timerEl) {
        timerEl.innerText = `${timeLeft}s`;
        if (timeLeft <= 2) timerEl.style.color = '#FF1D8E';
      }
    });

    socket.on('bet_timer_tick', ({ timeLeft }) => {
      const betEl = document.getElementById('betTimerNumber');
      if (betEl) betEl.innerText = timeLeft;
    });

    function renderPodiumBar(state) {
      const container = document.getElementById('teamsPodiumBar');
      container.innerHTML = '';

      state.teams.forEach(team => {
        const isTurn = (state.status === 'ROUND1' && state.r1.currentTurn === team.id) ||
                       (state.status === 'ROUND2' && (state.r2.currentTurn === team.id || state.r2.keywordTurn === team.id)) ||
                       (state.status === 'ROUND3_BET' && state.r3.currentTurn === team.id);

        const card = document.createElement('div');
        card.className = `team-card ${team.id} ${isTurn ? 'active-turn bell-pulse' : ''} ${team.locked ? 'locked' : ''}`;
        card.style.borderLeft = `5px solid ${team.color}`;

        let avatarClass = 'avatar-phoenix';
        if (team.avatar === 'azure_dragon') avatarClass = 'avatar-dragon';
        if (team.avatar === 'white_tiger') avatarClass = 'avatar-tiger';
        if (team.avatar === 'black_tortoise') avatarClass = 'avatar-tortoise';
        if (team.avatar === 'golden_qilin') avatarClass = 'avatar-qilin';

        card.innerHTML = `
          <div class="team-info">
            <div class="team-avatar ${avatarClass}"></div>
            <div>
              <div style="font-size: 1.15rem; color: ${team.color};">${team.name}</div>
              <div style="font-family: var(--font-mono); font-size: 0.75rem; color: ${team.locked ? '#ef4444' : (team.connected ? 'var(--c-tertiary)' : '#64748b')}; font-weight: ${team.locked ? 'bold' : 'normal'};">
                ${team.locked ? '✕ MẤT LƯỢT' : (team.connected ? '● Trực tuyến' : '○ Ngoại tuyến')}
              </div>
            </div>
          </div>
          <div class="team-score">${team.score}</div>
        `;
        container.appendChild(card);
      });
    }

    function renderStage(state) {
      const arena = document.getElementById('mainArena');
      const badgeTitle = document.getElementById('roundTitle');
      const buzzerAlert = document.getElementById('buzzerAlert');

      let activeTurnTeam = null;
      if (state.status === 'ROUND1' && state.r1.currentTurn) {
        activeTurnTeam = state.teams.find(t => t.id === state.r1.currentTurn);
      } else if (state.status === 'ROUND2' && state.r2.currentTurn) {
        activeTurnTeam = state.teams.find(t => t.id === state.r2.currentTurn);
      } else if (state.status === 'ROUND2' && state.r2.keywordTurn) {
        activeTurnTeam = state.teams.find(t => t.id === state.r2.keywordTurn);
      } else if (state.status === 'ROUND3_BET' && state.r3.currentTurn) {
        activeTurnTeam = state.teams.find(t => t.id === state.r3.currentTurn);
      }

      if (activeTurnTeam) {
        buzzerAlert.style.display = 'flex';
        document.getElementById('buzzerTeamName').innerText = `${activeTurnTeam.name.toUpperCase()} GIÀNH QUYỀN!`;
        document.getElementById('buzzerTeamName').style.color = activeTurnTeam.color;
        document.getElementById('buzzerDetails').innerText = state.r2.keywordTurn ? 'Đoán từ khóa chủ đề (+100 điểm)' : 'Thời gian trả lời: 45 giây';
      } else {
        buzzerAlert.style.display = 'none';
      }

      // 1. LOBBY
      if (state.status === 'LOBBY') {
        badgeTitle.innerText = 'PHÒNG CHỜ KHAI MẠC';
        const displayPlayerUrl = dynamicPlayerUrl || (window.location.origin + '/player');
        arena.innerHTML = `
          <div class="lobby-view">
            <h1 class="lobby-title electric-heading">RUNG CHUÔNG VÀNG</h1>
            <p class="lobby-sub">“Giải mã tri thức – Khám phá niềm tin – Chinh phục chuông vàng!”</p>
            
            <div class="lobby-qr-box">
              <img src="${dynamicQrUrl || state.qrUrl}" id="lobbyQrImage" class="lobby-qr-img" alt="QR Code">
              <div style="text-align: left;">
                <h3 style="color: var(--c-surface); font-size: 1.4rem; margin-bottom: 6px;">
                  QUÉT MÃ ĐỂ VÀO PHÒNG
                </h3>
                <p style="color: #cbd5e1; font-size: 1rem; margin-bottom: 8px;">
                  Mã phòng: <strong style="color: var(--c-tertiary); font-size: 1.3rem; font-family: var(--font-mono);">${state.roomCode}</strong>
                </p>
                <code id="lobbyPlayerUrlText" style="background: var(--c-dark); padding: 8px 14px; border-radius: 4px; color: var(--c-tertiary); font-family: var(--font-mono); font-size: 1.05rem; word-break: break-all; border: 1px solid var(--c-primary); display: inline-block;">
                  ${displayPlayerUrl}
                </code>
              </div>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 10px;">
              <span class="badge badge-gold">VÒNG 1: CHUÔNG VÀNG TRI THỨC</span>
              <span class="badge badge-jade">VÒNG 2: BỨC TRANH BÍ ẨN</span>
              <span class="badge badge-ruby">VÒNG 3: VỀ ĐÍCH CƯỢC ĐIỂM</span>
            </div>
          </div>
        `;
        return;
      }

      // 2. ROUND 1
      if (state.status === 'ROUND1') {
        badgeTitle.innerText = `VÒNG 1: CÂU HỎI ${state.r1.questionIndex + 1} / ${state.r1.totalQuestions}`;

        const q = state.r1.currentQuestion;
        if (!q) return;

        const letters = ['A', 'B', 'C', 'D'];
        const isRevealed = state.r1.stage === 'REVEALED';

        arena.innerHTML = `
          <div class="q-box">
            <div class="q-header-row">
              <span class="q-topic-tag">${q.topic || 'Triết học Mác – Lênin'}</span>
              <div class="q-timer-badge" id="qTimerDisplay">
                ${state.r1.timeLeft !== undefined && state.r1.timeLeft !== null ? state.r1.timeLeft : 45}s
              </div>
            </div>

            <div class="q-card">
              ${q.question}
            </div>

            <div class="options-grid">
              ${q.options.map((optText, idx) => {
                let optClass = 'opt-card';
                if (state.r1.selectedAnswer === idx) optClass += ' selected';
                if (isRevealed) {
                  if (idx === q.correctIndex) optClass += ' correct-answer';
                  else if (state.r1.selectedAnswer === idx) optClass += ' wrong-answer';
                }
                return `
                  <div class="${optClass}">
                    <span class="opt-letter">${letters[idx]}</span>
                    <span>${optText.replace(/^[A-D]\.\s*/, '')}</span>
                  </div>
                `;
              }).join('')}
            </div>

            ${isRevealed ? `
              <div class="explanation-overlay" style="position: static; margin-top: 14px; width: 100%; padding: 20px 28px;">
                <h3 style="color: var(--c-surface); font-size: 1.5rem; margin-bottom: 8px;">ĐÁP ÁN CHÍNH XÁC & GIẢI THÍCH</h3>
                <p style="font-size: 1.2rem; line-height: 1.5; color: #f1f5f9; margin-bottom: 8px;">
                  ${q.explanation}
                </p>
                <div style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--c-tertiary);">
                  Nguồn: ${q.source || 'Giáo trình Triết học Mác - Lênin'}
                </div>
              </div>
            ` : ''}
          </div>
        `;
        return;
      }

      // 3. ROUND 1 RECAP
      if (state.status === 'ROUND1_RECAP') {
        badgeTitle.innerText = 'TỔNG KẾT BẢNG ĐIỂM VÒNG 1';
        renderRecapBoard(arena, state, 'VÒNG 1: CHUÔNG VÀNG TRI THỨC');
        return;
      }

      // 4. ROUND 2 — BỨC TRANH BÍ ẨN
      if (state.status === 'ROUND2') {
        badgeTitle.innerText = 'VÒNG 2: GIẢI MÃ BỨC TRANH BÍ ẨN';

        const p = state.r2.currentPiece;
        const pieces = state.r2.piecesUnlocked;
        const isPieceActive = p && state.r2.stage !== 'IDLE';

        arena.innerHTML = `
          <div class="r2-container">
            <!-- Topbar with Stage Info, Timer and Keyword Status -->
            <div class="r2-topbar">
              <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <span class="badge badge-gold" style="font-size: 1rem; padding: 6px 14px;">VÒNG 2: BỨC TRANH BÍ ẨN</span>
                ${isPieceActive ? `
                  <span class="badge badge-jade" style="font-size: 1rem; padding: 6px 14px;">
                    MẢNH GHÉP SỐ ${state.r2.pieceIndex + 1}: ${p.title} (+20đ / 10đ)
                  </span>
                ` : ''}
              </div>

              <div style="display: flex; align-items: center; gap: 14px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span style="color: var(--c-surface); font-weight: bold; font-size: 0.95rem;">TỪ KHÓA CHỦ ĐỀ (+100Đ):</span>
                  <span class="badge ${state.r2.keywordSolved ? 'badge-jade' : 'badge-gold'}" style="font-size: 1rem; letter-spacing: 1px;">
                    ${state.r2.keywordSolved ? state.r2.keyword : '[ BÍ ẨN ]'}
                  </span>
                </div>
                ${isPieceActive ? `
                  <div class="q-timer-badge" id="qTimerDisplay">
                    ${state.r2.timeLeft !== undefined && state.r2.timeLeft !== null ? state.r2.timeLeft : 45}s
                  </div>
                ` : ''}
              </div>
            </div>

            ${isPieceActive ? `
              <!-- Active Piece Layout: Puzzle Board on Left, Full Question Box on Right -->
              <div class="r2-split-layout">
                <!-- Left: Puzzle Board Preview -->
                <div style="display: flex; flex-direction: column; gap: 12px;">
                  <div class="puzzle-board-wrapper">
                    <img src="/assets/images/round2_mystery.jpg" alt="Bức Tranh Bí Ẩn" class="puzzle-bg-image">
                    <div class="puzzle-grid">
                      ${[0, 1, 2, 3, 4, 5].map(idx => `
                        <div class="puzzle-tile ${pieces[idx] ? 'unlocked' : ''} ${state.r2.pieceIndex === idx ? 'active-piece' : ''}">
                          <span class="puzzle-tile-num">${idx + 1}</span>
                          <span class="puzzle-tile-label">${state.r2.pieceIndex === idx ? 'Đang Mở' : 'Mảnh ' + (idx + 1)}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                  <div style="padding: 10px 14px; background: var(--c-dark-surface); border: 1.5px solid var(--c-primary); border-radius: var(--radius-base); text-align: center; font-size: 0.9rem; color: #cbd5e1;">
                    💡 Bấm <strong style="color: var(--c-surface);">CHUÔNG TỪ KHÓA</strong> trên điện thoại bất cứ lúc nào để giải mã (+100đ)!
                  </div>
                </div>

                <!-- Right: High-prominence Question Box (Never Covered!) -->
                <div class="q-box" style="max-width: 100%;">
                  <div class="q-card" style="font-size: 1.6rem; padding: 22px 28px; line-height: 1.4; border-color: var(--c-tertiary); text-align: left;">
                    <div style="font-size: 0.95rem; color: var(--c-tertiary); font-weight: bold; margin-bottom: 6px; text-transform: uppercase;">
                      CÂU HỎI MẢNH GHÉP SỐ ${state.r2.pieceIndex + 1}
                    </div>
                    ${p.question}
                  </div>

                  <div class="options-grid" style="margin-top: 14px;">
                    ${p.options.map((optText, idx) => {
                      let optClass = 'opt-card';
                      if (state.r2.selectedAnswer === idx) optClass += ' selected';
                      if (state.r2.stage === 'PIECE_REVEALED') {
                        if (idx === p.correctIndex) optClass += ' correct-answer';
                        else if (state.r2.selectedAnswer === idx) optClass += ' wrong-answer';
                      }
                      return `
                        <div class="${optClass}">
                          <span class="opt-letter">${['A','B','C','D'][idx]}</span>
                          <span>${optText.replace(/^[A-D]\.\s*/, '')}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>

                  ${state.r2.stage === 'PIECE_REVEALED' ? `
                    <div class="explanation-overlay" style="position: static; margin-top: 14px;">
                      <h3 style="color: var(--c-surface); font-size: 1.4rem; margin-bottom: 8px;">
                        ĐÁP ÁN CHÍNH XÁC: ${['A','B','C','D'][p.correctIndex]}. ${p.options[p.correctIndex].replace(/^[A-D]\.\s*/, '')}
                      </h3>
                      <p style="font-size: 1.15rem; line-height: 1.5; color: #f1f5f9;">
                        ${p.explanation || 'Mảnh ghép đã được mở khóa thành công!'}
                      </p>
                    </div>
                  ` : ''}
                </div>
              </div>
            ` : `
              <!-- Idle Layout: Full Size Puzzle Board Centered -->
              <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 16px;">
                <div class="puzzle-board-wrapper puzzle-board-large">
                  <img src="/assets/images/round2_mystery.jpg" alt="Bức Tranh Bí Ẩn" class="puzzle-bg-image">
                  <div class="puzzle-grid">
                    ${[0, 1, 2, 3, 4, 5].map(idx => `
                      <div class="puzzle-tile ${pieces[idx] ? 'unlocked' : ''}">
                        <span class="puzzle-tile-num">${idx + 1}</span>
                        <span class="puzzle-tile-label">${pieces[idx] ? 'Đã Mở' : 'Mảnh ' + (idx + 1)}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <div style="padding: 16px 28px; background: var(--c-dark-surface); border: 2px solid var(--c-surface); border-radius: var(--radius-base); text-align: center; max-width: 680px; width: 100%;">
                  <h3 style="color: var(--c-surface); font-size: 1.3rem; margin-bottom: 6px;">
                    ĐANG CHỜ MC MỞ MẢNH GHÉP TIẾP THEO
                  </h3>
                  <p style="color: #cbd5e1; font-size: 1rem;">
                    Các đội chơi hãy sẵn sàng tay trên nút bấm chuông điện thoại để giành quyền mở mảnh (+20đ / 10đ)!
                  </p>
                </div>
              </div>
            `}
          </div>
        `;
        return;
      }

      // 5. ROUND 2 RECAP
      if (state.status === 'ROUND2_RECAP') {
        badgeTitle.innerText = 'TỔNG KẾT BẢNG ĐIỂM VÒNG 2';
        renderRecapBoard(arena, state, 'VÒNG 2: GIẢI MÃ BỨC TRANH BÍ ẨN');
        return;
      }

      // 6. ROUND 3 — CƯỢC ĐIỂM & VỀ ĐÍCH
      if (state.status === 'ROUND3_BET') {
        badgeTitle.innerText = 'VÒNG 3: VỀ ĐÍCH VÀ THỬ THÁCH CUỐI';

        if (state.r3.stage === 'BETTING') {
          arena.innerHTML = `
            <div class="r3-container">
              <h2 class="electric-heading" style="font-size: 2.5rem;">
                THỜI GIAN ĐẶT CƯỢC CHIẾN THUẬT
              </h2>
              <p style="font-size: 1.25rem; color: var(--c-surface);">
                Các đội có 10 giây để kéo thả và xác nhận mức cược trên điện thoại (từ 0 đến toàn bộ điểm hiện có).
              </p>
              
              <div class="r3-timer-circle" id="betTimerCircle">
                <span id="betTimerNumber">${state.r3.betTimeLeft || 10}</span>
              </div>
            </div>
          `;
          return;
        }

        if (state.r3.stage === 'TRANSITION') {
          arena.innerHTML = `
            <div class="r3-container" style="animation: bellPulse 1s infinite;">
              <h2 class="electric-heading" style="font-size: 2.8rem;">
                CHUẨN BỊ MỞ KHÓA THỬ THÁCH QUYẾT ĐỊNH...
              </h2>
              <p style="font-size: 1.4rem; color: var(--c-surface);">Cánh cửa vinh quang đang rộng mở!</p>
            </div>
          `;
          return;
        }

        if (state.r3.stage === 'REVEAL_BETS') {
          arena.innerHTML = `
            <div class="r3-container">
              <h2 class="electric-heading" style="font-size: 2.5rem; margin-bottom: 10px;">
                CÔNG BỐ ĐIỂM CƯỢC CỦA 5 ĐỘI
              </h2>
              <div class="wagers-table">
                ${state.teams.map(team => `
                  <div class="wager-col" style="border-top: 4px solid ${team.color};">
                    <div style="font-size: 1.25rem; color: ${team.color};">${team.name}</div>
                    <div style="font-family: var(--font-mono); font-size: 0.85rem; color: #cbd5e1;">Điểm: ${team.score}</div>
                    <div class="wager-amount">${state.r3.bets[team.id] || 0}</div>
                    <span class="badge badge-gold">ĐÃ KHÓA CƯỢC</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
          return;
        }

        // Final Question in Round 3
        if (state.r3.stage === 'QUESTION' || state.r3.stage === 'ANSWERING' || state.r3.stage === 'REVEALED') {
          const q = state.r3.question;
          const isRevealed = state.r3.stage === 'REVEALED';
          const wrongCount = (state.r3.wrongTeams || []).length;
          arena.innerHTML = `
            <div class="q-box" style="width: 100%; max-width: 1100px; padding-bottom: 24px;">
              <div class="q-header-row">
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                  <span class="q-topic-tag">CÂU HỎI QUYẾT ĐỊNH VẬN MỆNH</span>
                  ${wrongCount > 0 ? `
                    <span class="badge badge-ruby" style="font-size: 0.9rem; padding: 4px 10px;">
                      ⚡ ${wrongCount} đội đã mất quyền trả lời
                    </span>
                  ` : ''}
                </div>
                <div class="q-timer-badge" id="qTimerDisplay">
                  ${state.r3.timeLeft !== undefined && state.r3.timeLeft !== null ? state.r3.timeLeft : 45}s
                </div>
              </div>

              <!-- Question Card with Optimized Line Height & Padding -->
              <div class="q-card" style="border-color: var(--c-secondary); font-size: 1.55rem; padding: 20px 28px; line-height: 1.4; text-align: left;">
                <div style="font-size: 0.9rem; color: var(--c-secondary); font-weight: bold; margin-bottom: 6px; text-transform: uppercase;">
                  CÂU HỎI THỬ THÁCH VỀ ĐÍCH
                </div>
                ${q.question}
              </div>

              <div class="options-grid">
                ${q.options.map((optText, idx) => {
                  let optClass = 'opt-card';
                  if (state.r3.selectedAnswer === idx) optClass += ' selected';
                  if (isRevealed) {
                    if (idx === q.correctIndex) optClass += ' correct-answer';
                    else if (state.r3.selectedAnswer === idx) optClass += ' wrong-answer';
                  }
                  return `
                    <div class="${optClass}" style="font-size: 1.15rem; padding: 14px 18px; line-height: 1.35;">
                      <span class="opt-letter">${['A','B','C','D'][idx]}</span>
                      <span>${optText.replace(/^[A-D]\.\s*/, '')}</span>
                    </div>
                  `;
                }).join('')}
              </div>

              ${isRevealed ? `
                <div class="explanation-overlay" style="position: static; margin-top: 14px; width: 100%; padding: 20px 28px;">
                  <h3 style="color: var(--c-surface); font-size: 1.45rem; margin-bottom: 8px;">ĐÁP ÁN CHÍNH THỨC & Ý NGHĨA HỌC THUẬT</h3>
                  <p style="font-size: 1.15rem; line-height: 1.5; color: #f1f5f9; margin-bottom: 8px;">
                    ${q.explanation}
                  </p>
                  <div style="font-family: var(--font-mono); font-size: 0.9rem; color: var(--c-tertiary);">
                    Nguồn: ${q.source}
                  </div>
                </div>
              ` : ''}
            </div>
          `;
          return;
        }
      }

      // 7. FINALE PODIUM CEREMONY
      if (state.status.startsWith('FINALE')) {
        badgeTitle.innerText = 'LỄ VINH DANH & CÔNG BỐ KẾT QUẢ';
        renderFinaleCeremony(arena, state);
      }
    }

    function renderRecapBoard(arena, state, title) {
      const sorted = [...state.teams].sort((a,b) => b.score - a.score);
      arena.innerHTML = `
        <div style="width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px;">
          <h2 class="electric-heading" style="font-size: 2.5rem; text-align: center;">
            ${title}
          </h2>
          <div style="display: flex; flex-direction: column; gap: 10px;">
            ${sorted.map((t, idx) => `
              <div class="card-psy" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-left: 6px solid ${t.color}; background: var(--c-dark-surface);">
                <div style="display: flex; align-items: center; gap: 16px;">
                  <span style="font-family: var(--font-mono); font-size: 1.6rem; color: var(--c-surface); font-weight: 700;">#${idx + 1}</span>
                  <div style="font-size: 1.35rem; color: ${t.color};">${t.name}</div>
                </div>
                <div style="font-family: var(--font-mono); font-size: 2rem; color: var(--c-surface); font-weight: 700;">
                  ${t.score} <span style="font-size: 1rem; color: #94a3b8;">đ</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderFinaleCeremony(arena, state) {
      const step = state.finale.step;
      const lb = state.finale.leaderboard;
      const team1 = lb[0] || state.teams[0];
      const team2 = lb[1] || state.teams[1];
      const team3 = lb[2] || state.teams[2];

      // Step 1: Suspense
      if (step === 1) {
        arena.innerHTML = `
          <div class="podium-container" style="text-align: center;">
            <h1 class="electric-heading" style="font-size: 3.2rem; margin-top: 10px; color: var(--c-surface);">
              LỄ VINH DANH TOP 3 XUẤT SẮC NHẤT
            </h1>
            <p style="font-size: 1.6rem; color: #cbd5e1; margin-top: 14px;">
              Trận đấu khép lại • Sân khấu đóng băng chuẩn bị vinh danh Quán quân & Top 3!
            </p>
            <div style="margin-top: 25px; font-size: 1.3rem; color: var(--c-tertiary);">
              MC đang chuẩn bị công bố Hạng 3...
            </div>
          </div>
        `;
        return;
      }

      // Step 2: Rank 3 (Huy Chương Đồng)
      if (step === 2) {
        arena.innerHTML = `
          <div class="podium-container" style="animation: fadeIn 0.5s ease; text-align: center;">
            <div style="font-size: 1.8rem; color: #f59e0b; font-weight: bold; letter-spacing: 2px;">
              VINH DANH HẠNG 3 — HUY CHƯƠNG ĐỒNG
            </div>
            <h1 style="font-size: 4.5rem; color: ${team3.color}; margin: 12px 0;">
              ${team3.name}
            </h1>
            <div style="font-size: 3.5rem; font-weight: 700; color: var(--c-surface); margin-bottom: 20px;">
              ${team3.score} <span style="font-size: 1.5rem; color: #94a3b8;">ĐIỂM</span>
            </div>
            <div style="display: flex; gap: 20px; justify-content: center;">
              <span class="badge badge-gold">Vòng 1: +${team3.r1Score}đ</span>
              <span class="badge badge-jade">Vòng 2: +${team3.r2Score}đ</span>
              <span class="badge badge-ruby">Vòng 3: ${team3.r3Result >= 0 ? '+' : ''}${team3.r3Result}đ</span>
            </div>
          </div>
        `;
        return;
      }

      // Step 3: Rank 2 (Huy Chương Bạc)
      if (step === 3) {
        arena.innerHTML = `
          <div class="podium-container" style="animation: fadeIn 0.5s ease; text-align: center;">
            <div style="font-size: 1.8rem; color: #cbd5e1; font-weight: bold; letter-spacing: 2px;">
              VINH DANH HẠNG 2 (Á QUÂN) — HUY CHƯƠNG BẠC
            </div>
            <h1 style="font-size: 4.5rem; color: ${team2.color}; margin: 12px 0;">
              ${team2.name}
            </h1>
            <div style="font-size: 3.5rem; font-weight: 700; color: var(--c-surface); margin-bottom: 20px;">
              ${team2.score} <span style="font-size: 1.5rem; color: #94a3b8;">ĐIỂM</span>
            </div>
            <div style="display: flex; gap: 20px; justify-content: center;">
              <span class="badge badge-gold">Vòng 1: +${team2.r1Score}đ</span>
              <span class="badge badge-jade">Vòng 2: +${team2.r2Score}đ</span>
              <span class="badge badge-ruby">Vòng 3: ${team2.r3Result >= 0 ? '+' : ''}${team2.r3Result}đ</span>
            </div>
          </div>
        `;
        return;
      }

      // Step 4: Rank 1 (QUÁN QUÂN — CÚP CHUÔNG VÀNG)
      if (step === 4) {
        launchConfetti();
        arena.innerHTML = `
          <div class="podium-container" style="animation: fadeIn 0.5s ease; text-align: center;">
            <img src="/assets/images/golden_trophy.jpg" alt="Cúp Chuông Vàng" class="champion-trophy-img" style="width: 140px; height: 140px; object-fit: contain; margin-bottom: 10px;">
            <div style="font-size: 2.2rem; color: var(--c-surface); font-weight: 900; letter-spacing: 2px;">
              VINH DANH NHÀ VÔ ĐỊCH RUNG CHUÔNG VÀNG
            </div>
            <h1 style="font-size: 5rem; color: ${team1.color}; margin: 10px 0; text-shadow: 2px 2px 0px var(--c-neutral);">
              ${team1.name}
            </h1>
            <div style="font-size: 4rem; font-weight: 700; color: var(--c-surface); margin-bottom: 16px;">
              ${team1.score} <span style="font-size: 1.6rem; color: #94a3b8;">ĐIỂM</span>
            </div>
            <div style="display: flex; gap: 20px; justify-content: center;">
              <span class="badge badge-gold">Vòng 1: +${team1.r1Score}đ</span>
              <span class="badge badge-jade">Vòng 2: +${team1.r2Score}đ</span>
              <span class="badge badge-ruby">Vòng 3: ${team1.r3Result >= 0 ? '+' : ''}${team1.r3Result}đ</span>
            </div>
          </div>
        `;
        return;
      }

      // Step 5: BỤC PODIUM TOP 3 + BẢNG TỔNG SẮP
      if (step >= 5) {
        launchConfetti();
        arena.innerHTML = `
          <div style="width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 20px; align-items: center;">
            <h1 class="electric-heading" style="font-size: 2.8rem; text-align: center; color: var(--c-surface);">
              BỤC VINH DANH TOP 3 XUẤT SẮC NHẤT
            </h1>

            <!-- 3-Tier Olympic Podium -->
            <div style="display: flex; align-items: flex-end; justify-content: center; gap: 16px; width: 100%; max-width: 800px; margin: 15px 0 25px;">
              <!-- Hạng 2: Left -->
              <div style="flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center;">
                <div style="font-size: 1.4rem; color: #cbd5e1; font-weight: bold; margin-bottom: 6px;">Á Quân (Hạng 2)</div>
                <div style="font-size: 1.6rem; color: ${team2.color}; font-weight: bold; margin-bottom: 4px;">${team2.name}</div>
                <div style="font-size: 1.8rem; color: var(--c-surface); font-weight: bold; margin-bottom: 10px;">${team2.score}đ</div>
                <div style="width: 100%; height: 160px; background: linear-gradient(180deg, #94a3b8 0%, #475569 100%); border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #fff; font-weight: bold; border: 2px solid #cbd5e1;">
                  2
                </div>
              </div>

              <!-- Hạng 1: Center (Tallest) -->
              <div style="flex: 1.2; text-align: center; display: flex; flex-direction: column; align-items: center;">
                <div style="font-size: 1.8rem; color: var(--c-surface); font-weight: 900; margin-bottom: 6px;">QUÁN QUÂN</div>
                <div style="font-size: 2.2rem; color: ${team1.color}; font-weight: 900; margin-bottom: 4px;">${team1.name}</div>
                <div style="font-size: 2.4rem; color: var(--c-surface); font-weight: 900; margin-bottom: 10px;">${team1.score}đ</div>
                <div style="width: 100%; height: 230px; background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%); border-radius: 12px 12px 0 0; display: flex; align-items: center; justify-content: center; font-size: 4.5rem; color: #120722; font-weight: 900; border: 3px solid #fef08a; box-shadow: 0 0 35px rgba(251, 191, 36, 0.6);">
                  1
                </div>
              </div>

              <!-- Hạng 3: Right -->
              <div style="flex: 1; text-align: center; display: flex; flex-direction: column; align-items: center;">
                <div style="font-size: 1.4rem; color: #f59e0b; font-weight: bold; margin-bottom: 6px;">Quý Quân (Hạng 3)</div>
                <div style="font-size: 1.6rem; color: ${team3.color}; font-weight: bold; margin-bottom: 4px;">${team3.name}</div>
                <div style="font-size: 1.8rem; color: var(--c-surface); font-weight: bold; margin-bottom: 10px;">${team3.score}đ</div>
                <div style="width: 100%; height: 120px; background: linear-gradient(180deg, #d97706 0%, #78350f 100%); border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; color: #fff; font-weight: bold; border: 2px solid #f59e0b;">
                  3
                </div>
              </div>
            </div>

            <!-- Full Leaderboard Table of All 5 Teams -->
            <div style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
              ${lb.map(t => `
                <div class="card-psy" style="display: grid; grid-template-columns: 90px 1fr 130px 130px 130px 160px; align-items: center; padding: 12px 20px; border-left: 6px solid ${t.color}; background: var(--c-dark-surface);">
                  <span style="font-size: 1.4rem; color: ${t.rank <= 3 ? 'var(--c-surface)' : '#94a3b8'}; font-weight: 700;">
                    ${t.rank === 1 ? 'Quán Quân' : (t.rank === 2 ? 'Á Quân' : (t.rank === 3 ? 'Hạng Ba' : `Hạng ${t.rank}`))}
                  </span>
                  <div style="font-size: 1.3rem; color: ${t.color}; font-weight: bold;">${t.name}</div>
                  <div style="color: #cbd5e1; font-size: 0.95rem;">V1: <strong style="color: var(--c-surface);">+${t.r1Score}đ</strong></div>
                  <div style="color: #cbd5e1; font-size: 0.95rem;">V2: <strong style="color: var(--c-tertiary);">+${t.r2Score}đ</strong></div>
                  <div style="color: #cbd5e1; font-size: 0.95rem;">V3: <strong style="color: ${t.r3Result >= 0 ? 'var(--c-tertiary)' : 'var(--c-secondary)'};">${t.r3Result >= 0 ? '+' : ''}${t.r3Result}đ</strong></div>
                  <div style="font-size: 1.7rem; font-weight: 700; color: var(--c-surface); text-align: right;">
                    ${t.score} đ
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
