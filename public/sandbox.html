<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHÒNG GIẢ LẬP 5 ĐỘI — ANIME RELIGION QUIZ ARENA (60s PSYCHEDELIC)</title>
  <link rel="stylesheet" href="/assets/css/arena_theme.css">
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at center, #1b0a33 0%, #120722 100%);
      overflow-x: auto;
      color: #fff;
      font-family: var(--font-body);
    }
    .sandbox-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(18, 7, 34, 0.95);
      border-bottom: 3px solid var(--psy-orange);
      box-shadow: 0 4px 20px rgba(255, 95, 0, 0.25);
    }
    .sandbox-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--psy-yellow);
      text-shadow: 2px 2px 0 var(--psy-pink);
      margin: 0;
    }
    .sandbox-subtitle {
      font-size: 0.9rem;
      color: var(--psy-lime);
      margin: 0;
      font-family: var(--font-body);
    }
    .sandbox-phones-container {
      display: flex;
      gap: 20px;
      padding: 24px;
      flex: 1;
      justify-content: center;
      align-items: stretch;
      min-width: 1600px;
    }
    .phone-mockup {
      width: 310px;
      height: 750px;
      background: #120722;
      border: 5px solid #4700A5;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(160, 32, 240, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .phone-mockup.team-1 { border-color: var(--psy-pink); box-shadow: 0 0 25px rgba(255, 29, 142, 0.4); }
    .phone-mockup.team-2 { border-color: var(--psy-lime); box-shadow: 0 0 25px rgba(194, 247, 0, 0.4); }
    .phone-mockup.team-3 { border-color: var(--psy-yellow); box-shadow: 0 0 25px rgba(255, 215, 0, 0.4); }
    .phone-mockup.team-4 { border-color: var(--psy-purple); box-shadow: 0 0 25px rgba(160, 32, 240, 0.4); }
    .phone-mockup.team-5 { border-color: var(--psy-orange); box-shadow: 0 0 25px rgba(255, 95, 0, 0.4); }

    .phone-notch {
      width: 120px;
      height: 18px;
      background: #4700A5;
      border-radius: 0 0 10px 10px;
      margin: 0 auto;
      z-index: 10;
      flex-shrink: 0;
    }
    .phone-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #120722;
    }
    .phone-label {
      text-align: center;
      padding: 8px;
      font-weight: 700;
      font-size: 1rem;
      background: rgba(18, 7, 34, 0.95);
      font-family: var(--font-display);
      letter-spacing: 0.5px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="sandbox-topbar">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--psy-lime)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
        <path d="M6 12h4m-2-2v4"></path>
        <circle cx="17" cy="10" r="1" fill="var(--psy-lime)"></circle>
        <circle cx="15" cy="13" r="1" fill="var(--psy-lime)"></circle>
      </svg>
      <div>
        <h2 class="sandbox-title">PHÒNG GIẢ LẬP 5 ĐIỆN THOẠI ĐỒNG THỜI</h2>
        <p class="sandbox-subtitle">Thử nghiệm bấm chuông miligiây, trả lời và cược điểm của 5 đội trên 1 màn hình</p>
      </div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <a href="/projector" target="_blank" class="btn btn-gold" style="display: inline-flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span>Mở Máy Chiếu</span>
      </a>
      <a href="/mc" target="_blank" class="btn btn-ruby" style="display: inline-flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
          <line x1="4" y1="22" x2="4" y2="15"></line>
        </svg>
        <span>Bảng MC</span>
      </a>
      <a href="/" class="btn btn-ghost" style="display: inline-flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Trang Chủ</span>
      </a>
    </div>
  </div>

  <div class="sandbox-phones-container">
    <!-- Phone 1: Hỏa Phượng -->
    <div class="phone-mockup team-1">
      <div class="phone-notch"></div>
      <div class="phone-label" style="color: var(--psy-pink);">ĐỘI 1: HỎA PHƯỢNG</div>
      <iframe src="/player?team=team-1" class="phone-iframe" title="Player 1"></iframe>
    </div>

    <!-- Phone 2: Thanh Long -->
    <div class="phone-mockup team-2">
      <div class="phone-notch"></div>
      <div class="phone-label" style="color: var(--psy-lime);">ĐỘI 2: THANH LONG</div>
      <iframe src="/player?team=team-2" class="phone-iframe" title="Player 2"></iframe>
    </div>

    <!-- Phone 3: Bạch Hổ -->
    <div class="phone-mockup team-3">
      <div class="phone-notch"></div>
      <div class="phone-label" style="color: var(--psy-yellow);">ĐỘI 3: BẠCH HỔ</div>
      <iframe src="/player?team=team-3" class="phone-iframe" title="Player 3"></iframe>
    </div>

    <!-- Phone 4: Huyền Vũ -->
    <div class="phone-mockup team-4">
      <div class="phone-notch"></div>
      <div class="phone-label" style="color: var(--psy-purple);">ĐỘI 4: HUYỀN VŨ</div>
      <iframe src="/player?team=team-4" class="phone-iframe" title="Player 4"></iframe>
    </div>

    <!-- Phone 5: Kim Lân -->
    <div class="phone-mockup team-5">
      <div class="phone-notch"></div>
      <div class="phone-label" style="color: var(--psy-orange);">ĐỘI 5: KIM LÂN</div>
      <iframe src="/player?team=team-5" class="phone-iframe" title="Player 5"></iframe>
    </div>
  </div>
</body>
</html>
