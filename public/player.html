<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ĐIỆN THOẠI ĐỘI CHƠI — RUNG CHUÔNG VÀNG</title>
  <link rel="stylesheet" href="/assets/css/arena_theme.css">
  <style>
    body {
      touch-action: manipulation;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--c-dark);
      overflow-x: hidden;
    }
    .player-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      gap: 14px;
    }

    /* Sticky Team Header */
    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-radius: var(--radius-base);
      background: var(--c-dark-surface);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .player-team-title {
      font-size: 1.3rem;
      letter-spacing: 0.3px;
    }
    .player-score-pill {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--c-surface);
    }

    /* Status Banner */
    .player-status-card {
      padding: 14px;
      border-radius: var(--radius-base);
      text-align: center;
      font-size: 1.15rem;
      background: var(--c-dark-surface);
      border: 1px solid var(--c-primary);
      transition: all 0.3s ease;
    }

    /* Main Interaction Canvas */
    .interaction-canvas {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      min-height: 340px;
    }

    /* Massive Psychedelic Bell Buzzer */
    .big-buzzer-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: 6px solid var(--c-surface);
      background: radial-gradient(circle at 35% 35%, var(--c-surface) 0%, var(--c-primary) 60%, var(--c-neutral) 100%);
      color: var(--c-neutral);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(255, 95, 0, 0.7);
      transition: var(--spring-transition);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      pointer-events: auto !important;
    }
    .big-buzzer-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 60px rgba(255, 215, 0, 0.9);
    }
    .big-buzzer-btn.btn-buzzer-ready {
      border: 6px solid #FFF5A0;
      background: radial-gradient(circle at 35% 35%, #FFF5A0 0%, var(--c-surface) 35%, var(--c-primary) 70%, var(--c-neutral) 100%);
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.9), 0 0 25px rgba(255, 95, 0, 0.8);
      animation: bellPulse 1.2s infinite;
    }
    .big-buzzer-btn.btn-buzzer-waiting {
      opacity: 0.75;
      filter: grayscale(0.2);
      border: 5px solid rgba(255, 215, 0, 0.5);
      background: radial-gradient(circle at 35% 35%, #FFD700 0%, #FF5F00 50%, #4700A5 100%);
      box-shadow: 0 0 15px rgba(255, 95, 0, 0.3);
    }
    .big-buzzer-btn.btn-buzzer-buzzed {
      border-color: var(--c-tertiary);
      box-shadow: 0 0 35px rgba(194, 247, 0, 0.8);
      background: radial-gradient(circle at 35% 35%, #C2F700 0%, #4700A5 80%);
    }
    .big-buzzer-btn.btn-buzzer-locked {
      opacity: 0.45;
      filter: grayscale(0.8);
      border-color: #64748b;
      box-shadow: none;
    }
    .buzzer-icon {
      width: 64px;
      height: 64px;
      stroke: var(--c-neutral);
    }
    .buzzer-label {
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 6px;
      color: var(--c-neutral);
    }

    /* Round 2 Dual Buzzer Buttons */
    .r2-buzzer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      width: 100%;
    }
    .dual-buzzer-btn {
      width: 100%;
      padding: 24px 16px;
      border-radius: var(--radius-base);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: var(--font-display);
      font-size: 1.4rem;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      border: 2px solid transparent;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      transition: var(--spring-transition);
      pointer-events: auto !important;
    }
    .dual-buzzer-btn:active {
      transform: scale(0.95);
    }
    .dual-buzzer-btn.btn-buzzer-waiting {
      opacity: 0.7;
    }
    .dual-buzzer-btn.btn-buzzer-ready {
      opacity: 1;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
      animation: bellPulse 1.3s infinite;
    }
    .btn-piece-buzzer {
      background: linear-gradient(135deg, var(--c-primary) 0%, var(--c-neutral) 100%);
      border-color: var(--c-tertiary);
      color: var(--c-white);
    }
    .btn-keyword-buzzer {
      background: linear-gradient(135deg, var(--c-surface) 0%, var(--c-secondary) 100%);
      border-color: var(--c-surface);
      color: var(--c-neutral);
    }

    /* Floating Toast Notification */
    .player-toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(18, 7, 34, 0.96);
      border: 2px solid var(--c-surface);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: var(--radius-base);
      font-size: 1.05rem;
      font-weight: 700;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85);
      z-index: 9999;
      text-align: center;
      max-width: 90vw;
      width: max-content;
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .player-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Answer Selection Mode */
    .player-options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }
    .player-opt-btn {
      padding: 22px 14px;
      border-radius: var(--radius-base);
      background: var(--c-dark-surface);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-family: var(--font-display);
      font-size: 1.6rem;
      cursor: pointer;
      transition: var(--spring-transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .player-opt-btn:active {
      transform: scale(0.95);
      background: rgba(255, 215, 0, 0.25);
      border-color: var(--c-surface);
    }
    .player-opt-btn.selected {
      background: rgba(255, 215, 0, 0.3);
      border-color: var(--c-surface);
    }

    /* Wager Section in Round 3 */
    .wager-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 20px;
      border-radius: var(--radius-base);
      background: var(--c-dark-surface);
      border: 2px solid var(--c-primary);
    }
    .wager-slider {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      background: #1e293b;
      outline: none;
      accent-color: var(--c-surface);
    }
    .chips-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .chip-btn {
      flex: 1;
      padding: 10px 4px;
      border-radius: var(--radius-base);
      background: var(--c-neutral);
      border: 1px solid var(--c-surface);
      color: var(--c-surface);
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .chip-btn:active {
      background: var(--c-primary);
      color: #fff;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 7, 34, 0.92);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .team-picker-card {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .team-select-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-radius: var(--radius-base);
      background: var(--c-dark-surface);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: var(--spring-transition);
    }
    .team-select-item:active {
      transform: translateX(4px);
      border-color: var(--c-surface);
    }
  </style>
</head>
<body>
  <div class="arena-bg">
    <div class="particles-layer"></div>
  </div>

  <div class="player-container">
    <!-- Sticky Team Header -->
    <header class="player-header" id="playerHeader">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="team-avatar avatar-phoenix" id="playerAvatar"></div>
        <div>
          <div class="player-team-title" id="playerTeamName">Chọn Đội Của Bạn</div>
          <div style="display: flex; gap: 6px; align-items: center; margin-top: 2px;">
            <span class="badge badge-gold" id="playerRoomBadge">PHÒNG: ARENA88</span>
            <button onclick="switchTeamPrompt()" class="btn btn-ghost" style="padding: 2px 8px; font-size: 0.75rem; border-radius: 4px; border: 1px solid var(--c-primary); color: var(--c-surface);">Đổi Đội</button>
          </div>
        </div>
      </div>
      <div style="text-align: right;">
        <div style="font-family: var(--font-mono); font-size: 0.75rem; color: #cbd5e1;">ĐIỂM HIỆN TẠI</div>
        <div class="player-score-pill" id="playerScore">0</div>
      </div>
    </header>

    <!-- Status Banner -->
    <div class="player-status-card" id="playerStatusCard">
      Đang kết nối tới máy chủ...
    </div>

    <!-- Main Interaction Canvas -->
    <main class="interaction-canvas" id="playerCanvas">
      <!-- Dynamic action controls render here -->
    </main>

    <!-- Bottom info -->
    <footer style="text-align: center; color: #94a3b8; font-size: 0.85rem; font-family: var(--font-mono);">
      RUNG CHUÔNG VÀNG • PSICODÉLICO ANOS 60
    </footer>
  </div>

  <!-- Team Selection Modal -->
  <div class="modal-overlay" id="teamSelectModal" style="display: none;">
    <div class="team-picker-card">
      <div style="text-align: center; margin-bottom: 8px;">
        <h2 class="electric-heading" style="font-size: 1.8rem;">
          CHỌN ĐỘI THI ĐẤU
        </h2>
        <p style="color: var(--c-surface); font-size: 0.95rem;">Chọn đội bạn đại diện để nhận quyền bấm chuông</p>
      </div>

      <div id="teamSelectList" style="display: flex; flex-direction: column; gap: 10px;">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/assets/js/sound_engine.js"></script>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    let myTeamId = urlParams.get('team') || localStorage.getItem('arena_team_id') || null;
    let currentGameState = null;
    let selectedWager = 0;

    // 100% Transparent Vector Golden Bell Component (Zero black boxes, zero font glitches)
    function renderGoldenBellSvg(size = 110) {
      return `
        <div class="golden-bell-wrap" style="width: ${size}px; height: ${size}px;">
          <svg class="golden-bell-svg" width="${size}" height="${size}" viewBox="0 0 100 100" fill="none">
            <defs>
              <linearGradient id="bellGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFF5A0" />
                <stop offset="30%" stop-color="#FFD700" />
                <stop offset="70%" stop-color="#FF5F00" />
                <stop offset="100%" stop-color="#FF1D8E" />
              </linearGradient>
              <linearGradient id="bellRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FF5F00" />
                <stop offset="50%" stop-color="#FFD700" />
                <stop offset="100%" stop-color="#FF5F00" />
              </linearGradient>
              <linearGradient id="bellHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="rgba(255,255,255,0.85)" />
                <stop offset="100%" stop-color="rgba(255,255,255,0)" />
              </linearGradient>
            </defs>
            <!-- Hanger Loop -->
            <path d="M42 15 C42 7, 58 7, 58 15 L58 23 L42 23 Z" fill="#FFD700" stroke="#FF5F00" stroke-width="3" stroke-linejoin="round" />
            <!-- Bell Dome Body -->
            <path d="M50 21 C34 21, 26 43, 23 65 C23 71, 19 76, 12 78 C12 83, 88 83, 88 78 C81 76, 77 71, 77 65 C74 43, 66 21, 50 21 Z" fill="url(#bellGoldGrad)" stroke="#FF5F00" stroke-width="3.5" stroke-linejoin="round" />
            <!-- Base Rim Ellipse -->
            <ellipse cx="50" cy="78" rx="38" ry="7" fill="url(#bellRimGrad)" stroke="#FF5F00" stroke-width="3" />
            <!-- Clapper Ball -->
            <circle cx="50" cy="82" r="8.5" fill="#FF1D8E" stroke="#FFD700" stroke-width="3" />
            <!-- Specular Reflection Highlight -->
            <path d="M32 33 C36 25, 42 23, 46 22 C42 29, 37 44, 35 61 C32 56, 29 43, 32 33 Z" fill="url(#bellHighlight)" />
          </svg>
        </div>
      `;
    }

    function joinTeam(teamId) {
      myTeamId = teamId;
      localStorage.setItem('arena_team_id', teamId);
      document.getElementById('teamSelectModal').style.display = 'none';

      socket.emit('team_join', {
        teamId: myTeamId,
        roomCode: currentGameState?.roomCode || 'ARENA88'
      });
    }

    function switchTeamPrompt() {
      if (currentGameState && currentGameState.teams) {
        renderTeamSelectModal(currentGameState.teams);
      } else {
        document.getElementById('teamSelectModal').style.display = 'flex';
      }
    }

    socket.on('connect', () => {
      console.log('Player socket connected');
      if (myTeamId) {
        joinTeam(myTeamId);
      }
    });

    socket.on('join_success', ({ team, roomCode }) => {
      document.getElementById('playerRoomBadge').innerText = `PHÒNG: ${roomCode}`;
      updateTeamHeader(team);
    });

    socket.on('join_error', (msg) => {
      alert(msg);
      document.getElementById('teamSelectModal').style.display = 'flex';
    });

    socket.on('play_sound', (name) => {
      if (window.quizSound) window.quizSound.playSound(name);
    });

    function handleIncomingPlayerState(state) {
      if (!state) return;
      currentGameState = state;

      if (!myTeamId) {
        renderTeamSelectModal(state.teams);
        return;
      }

      const team = state.teams.find(t => t.id === myTeamId);
      if (team) {
        updateTeamHeader(team);
      }

      renderPlayerView(state);
    }

    socket.on('game_state', handleIncomingPlayerState);
    socket.on('gameState', handleIncomingPlayerState);

    // Initial state fetch so UI renders immediately without waiting for first socket packet
    fetch('/api/state')
      .then(r => r.json())
      .then(st => handleIncomingPlayerState(st))
      .catch(() => {});

    function updateTeamHeader(team) {
      document.getElementById('playerTeamName').innerText = team.name;
      document.getElementById('playerTeamName').style.color = team.color;
      document.getElementById('playerScore').innerText = team.score;
      document.getElementById('playerHeader').style.borderLeft = `5px solid ${team.color}`;

      let avatarClass = 'avatar-phoenix';
      if (team.avatar === 'azure_dragon') avatarClass = 'avatar-dragon';
      if (team.avatar === 'white_tiger') avatarClass = 'avatar-tiger';
      if (team.avatar === 'black_tortoise') avatarClass = 'avatar-tortoise';
      if (team.avatar === 'golden_qilin') avatarClass = 'avatar-qilin';

      const av = document.getElementById('playerAvatar');
      av.className = `team-avatar ${avatarClass}`;
      av.style.borderColor = team.color;
    }

    function renderTeamSelectModal(teams) {
      const modal = document.getElementById('teamSelectModal');
      modal.style.display = 'flex';
      const list = document.getElementById('teamSelectList');
      list.innerHTML = '';

      teams.forEach(team => {
        const item = document.createElement('div');
        item.className = 'team-select-item';
        item.style.borderLeft = `5px solid ${team.color}`;
        item.innerHTML = `
          <div>
            <div style="font-size: 1.2rem; color: ${team.color};">${team.name}</div>
            <div style="font-family: var(--font-mono); font-size: 0.8rem; color: #cbd5e1;">${team.mascot || 'Thần thú'}</div>
          </div>
          <span class="badge ${team.connected ? 'badge-ruby' : 'badge-live'}">
            ${team.connected ? 'Đang dùng' : 'Sẵn sàng'}
          </span>
        `;
        item.onclick = () => joinTeam(team.id);
        list.appendChild(item);
      });
    }

    function showToast(msg, duration = 3000) {
      let toast = document.getElementById('playerToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'playerToast';
        toast.className = 'player-toast';
        document.body.appendChild(toast);
      }
      toast.innerText = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    function testBuzzer() {
      if (window.quizSound) window.quizSound.playBuzzer();
      if (navigator.vibrate) {
        try { navigator.vibrate([150, 80, 150]); } catch(e) {}
      }
      showToast('✅ Chuông & Âm thanh hoạt động cực tốt! Sẵn sàng thi đấu.');
    }

    function renderPlayerView(state) {
      const canvas = document.getElementById('playerCanvas');
      const statusCard = document.getElementById('playerStatusCard');
      const team = state.teams.find(t => t.id === myTeamId);

      if (!team) return;

      // 1. LOBBY — Phòng chờ
      if (state.status === 'LOBBY') {
        statusCard.innerHTML = `<span style="color: var(--c-tertiary); font-weight: 700; letter-spacing: 0.5px;">● ĐÃ KẾT NỐI SẴN SÀNG</span>`;
        canvas.innerHTML = `
          <div style="text-align: center; padding: 15px 10px; width: 100%;">
            <h3 style="font-size: 1.6rem; color: var(--c-surface); text-shadow: 2px 2px 0 var(--c-secondary); margin-bottom: 6px;">
              ${team.name.toUpperCase()}
            </h3>
            <p style="color: #cbd5e1; font-size: 1rem; margin-bottom: 18px; line-height: 1.4;">
              Vui lòng theo dõi màn hình máy chiếu.<br>Bấm thử nút chuông dưới đây để kiểm tra âm thanh:
            </p>

            <button class="big-buzzer-btn btn-buzzer-ready" onclick="testBuzzer()" style="width: 180px; height: 180px; margin: 0 auto;">
              ${renderGoldenBellSvg(70)}
              <span class="buzzer-label" style="font-size: 1.15rem;">THỬ CHUÔNG</span>
            </button>

            <div style="font-size: 0.95rem; color: var(--c-surface); font-weight: bold; margin-top: 14px;">
              🔔 Bấm vào chuông vàng để thử âm thanh & độ nhạy
            </div>
          </div>
        `;
        return;
      }

      // 2. ROUND 1 — Chuông Vàng Tri Thức
      if (state.status === 'ROUND1') {
        const isBuzzerOpen = state.r1.stage === 'BUZZER_OPEN';
        const isMyTurn = state.r1.currentTurn === myTeamId;
        const alreadyBuzzed = state.r1.buzzerQueue.some(b => b.teamId === myTeamId);
        const myQueuePos = state.r1.buzzerQueue.findIndex(b => b.teamId === myTeamId) + 1;
        const answeringTeam = state.teams.find(t => t.id === state.r1.currentTurn);

        // Case 2.1: My Turn to Answer
        if (isMyTurn && state.r1.stage === 'ANSWERING') {
          statusCard.innerHTML = `
            <div style="color: var(--c-tertiary); font-size: 1.25rem; font-weight: bold;">
              CHÚC MỪNG! ĐỘI BẠN ĐÃ GIÀNH QUYỀN TRẢ LỜI! (${state.r1.timeLeft !== undefined && state.r1.timeLeft !== null ? state.r1.timeLeft : 45}s)
            </div>
          `;
          canvas.innerHTML = `
            <div style="width: 100%; text-align: center;">
              <p style="color: var(--c-surface); font-size: 1.15rem; margin-bottom: 12px; font-weight: bold;">
                CHỌN ĐÁP ÁN TRÊN ĐIỆN THOẠI HOẶC ĐỌC CHO MC:
              </p>
              <div class="player-options-grid">
                ${['A', 'B', 'C', 'D'].map((letter, idx) => `
                  <button class="player-opt-btn ${state.r1.selectedAnswer === idx ? 'selected' : ''}" onclick="selectAnswer(${idx})">
                    <span style="font-size: 2.2rem; color: var(--c-surface); font-weight: bold;">${letter}</span>
                    <span style="font-size: 0.9rem; color: #cbd5e1;">Phương án ${letter}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          `;
          return;
        }

        // Case 2.2: Another Team is Answering
        if (state.r1.stage === 'ANSWERING' && !isMyTurn) {
          statusCard.innerHTML = `
            <span style="color: var(--c-surface); font-weight: bold;">
              Đội ${answeringTeam ? answeringTeam.name : 'đối thủ'} đang trả lời (${state.r1.timeLeft !== undefined && state.r1.timeLeft !== null ? state.r1.timeLeft : 45}s)...
            </span>
          `;
          canvas.innerHTML = `
            <button class="big-buzzer-btn btn-buzzer-waiting" onclick="handleBuzzerClick('NORMAL')">
              ${renderGoldenBellSvg(75)}
              <span class="buzzer-label" style="font-size: 1.1rem;">ĐỢI LƯỢT</span>
            </button>
            <div style="font-size: 0.95rem; color: #cbd5e1; text-align: center; margin-top: 8px;">
              Chuông sẽ mở lại nếu đội đối thủ trả lời sai hoặc hết giờ.
            </div>
          `;
          return;
        }

        // Case 2.3: Buzzer is Open for All Teams
        if (isBuzzerOpen) {
          if (alreadyBuzzed) {
            statusCard.innerHTML = `<span style="color: var(--c-tertiary); font-weight: bold;">ĐÃ BẤM CHUÔNG THÀNH CÔNG! (HẠNG #${myQueuePos})</span>`;
            canvas.innerHTML = `
              <button class="big-buzzer-btn btn-buzzer-buzzed" onclick="handleBuzzerClick('NORMAL')">
                ${renderGoldenBellSvg(75)}
                <span class="buzzer-label" style="font-size: 1.05rem;">HẠNG #${myQueuePos}</span>
              </button>
              <div style="font-size: 1.05rem; color: var(--c-tertiary); font-weight: 700; text-align: center; margin-top: 8px;">
                Đã ghi nhận thứ tự #${myQueuePos}! Vui lòng chờ MC gọi tên.
              </div>
            `;
            return;
          }

          if (team.locked) {
            statusCard.innerHTML = `<span style="color: var(--c-secondary); font-weight: bold;">ĐÃ MẤT LƯỢT Ở CÂU HỎI NÀY</span>`;
            canvas.innerHTML = `
              <button class="big-buzzer-btn btn-buzzer-locked" onclick="handleBuzzerClick('NORMAL')">
                ${renderGoldenBellSvg(75)}
                <span class="buzzer-label" style="font-size: 1.1rem;">MẤT LƯỢT</span>
              </button>
            `;
            return;
          }

          // Ready to Buzz!
          statusCard.innerHTML = `<span style="color: var(--c-surface); font-weight: bold;" class="undulate-text">⚡ CHUÔNG ĐÃ MỞ! BẤM NGAY ĐỂ GIÀNH QUYỀN!</span>`;
          canvas.innerHTML = `
            <button class="big-buzzer-btn btn-buzzer-ready" id="mainBuzzerBtn" onclick="handleBuzzerClick('NORMAL')">
              ${renderGoldenBellSvg(75)}
              <span class="buzzer-label">BẤM CHUÔNG</span>
            </button>
            <div style="font-size: 1.1rem; color: var(--c-surface); font-weight: bold; text-align: center; margin-top: 6px;">
              ⚡ Chạm vào chuông thật nhanh!
            </div>
          `;
          return;
        }

        // Case 2.4: Question Reading by MC
        if (state.r1.stage === 'QUESTION_OPEN') {
          statusCard.innerHTML = `<span>MC ĐANG ĐỌC CÂU HỎI ${state.r1.questionIndex + 1}...</span>`;
          canvas.innerHTML = `
            <button class="big-buzzer-btn btn-buzzer-waiting" onclick="handleBuzzerClick('NORMAL')">
              ${renderGoldenBellSvg(75)}
              <span class="buzzer-label">BẤM CHUÔNG</span>
            </button>
            <div style="font-size: 0.95rem; color: var(--c-surface); text-align: center; margin-top: 8px;">
              ⏳ Chuông sẽ kích hoạt ngay khi MC phát hiệu lệnh mở chuông!
            </div>
          `;
          return;
        }

        // Case 2.5: Answer Revealed
        if (state.r1.stage === 'REVEALED') {
          statusCard.innerHTML = `<span>ĐÃ CÔNG BỐ ĐÁP ÁN CÂU ${state.r1.questionIndex + 1}</span>`;
          canvas.innerHTML = `
            <button class="big-buzzer-btn btn-buzzer-waiting" onclick="handleBuzzerClick('NORMAL')">
              ${renderGoldenBellSvg(75)}
              <span class="buzzer-label">BẤM CHUÔNG</span>
            </button>
            <div style="font-size: 0.95rem; color: #cbd5e1; text-align: center; margin-top: 8px;">
              Chuẩn bị cho câu hỏi tiếp theo...
            </div>
          `;
          return;
        }

        // Default Round 1 Idle
        statusCard.innerHTML = `<span>ĐANG CHỜ HIỆU LỆNH CỦA MC...</span>`;
        canvas.innerHTML = `
          <button class="big-buzzer-btn btn-buzzer-waiting" onclick="handleBuzzerClick('NORMAL')">
            ${renderGoldenBellSvg(75)}
            <span class="buzzer-label">BẤM CHUÔNG</span>
          </button>
          <div style="font-size: 0.95rem; color: #cbd5e1; text-align: center; margin-top: 8px;">
            Quan sát màn hình máy chiếu
          </div>
        `;
        return;
      }

      // 3. ROUND 2 — Bức Tranh Bí Ẩn (Dual Buzzers)
      if (state.status === 'ROUND2') {
        const p = state.r2.currentPiece;
        const isPieceBuzzerOpen = state.r2.stage === 'PIECE_BUZZER';
        const isMyPieceTurn = state.r2.currentTurn === myTeamId && state.r2.stage === 'PIECE_ANSWERING';
        const isMyKeywordTurn = state.r2.keywordTurn === myTeamId;
        const otherPieceTurn = state.r2.currentTurn && state.r2.currentTurn !== myTeamId;
        const otherTeamObj = otherPieceTurn ? state.teams.find(t => t.id === state.r2.currentTurn) : null;

        if (isMyPieceTurn) {
          statusCard.innerHTML = `
            <div style="color: var(--c-tertiary); font-size: 1.2rem; font-weight: bold;">
              BẠN GIÀNH QUYỀN TRẢ LỜI MẢNH GHÉP ${state.r2.pieceIndex + 1}! (${state.r2.timeLeft !== undefined && state.r2.timeLeft !== null ? state.r2.timeLeft : 45}s)
            </div>
          `;
          canvas.innerHTML = `
            <div style="width: 100%; text-align: center;">
              ${p ? `
                <div style="background: rgba(18,7,34,0.9); padding: 12px 16px; border-radius: var(--radius-base); border: 2px solid var(--c-tertiary); margin-bottom: 12px; text-align: left;">
                  <div style="font-size: 0.85rem; color: var(--c-tertiary); font-weight: bold; margin-bottom: 3px;">
                    MẢNH GHÉP ${state.r2.pieceIndex + 1}: ${p.title}
                  </div>
                  <div style="font-size: 1.15rem; color: #fff; font-weight: bold; line-height: 1.4;">
                    ${p.question}
                  </div>
                </div>
              ` : ''}

              <p style="color: var(--c-surface); font-size: 1.05rem; margin-bottom: 10px; font-weight: bold;">CHỌN ĐÁP ÁN CHO MẢNH GHÉP:</p>
              <div class="player-options-grid">
                ${['A', 'B', 'C', 'D'].map((letter, idx) => `
                  <button class="player-opt-btn" onclick="selectAnswer(${idx})">
                    <span style="font-size: 2rem; color: var(--c-tertiary); font-weight: bold;">${letter}</span>
                    <span style="font-size: 0.9rem; color: #cbd5e1; text-align: center;">
                      ${p?.options ? p.options[idx].replace(/^[A-D]\.\s*/, '') : 'Phương án ' + letter}
                    </span>
                  </button>
                `).join('')}
              </div>
            </div>
          `;
          return;
        }

        if (otherPieceTurn) {
          statusCard.innerHTML = `
            <span style="color: var(--c-surface); font-weight: bold;">
              Đội ${otherTeamObj ? otherTeamObj.name : 'đối thủ'} đang trả lời Mảnh ghép (${state.r2.timeLeft !== undefined && state.r2.timeLeft !== null ? state.r2.timeLeft : 45}s)...
            </span>
          `;
        } else {
          statusCard.innerHTML = `<span>VÒNG 2: GIẢI MÃ BỨC TRANH BÍ ẨN</span>`;
        }

        canvas.innerHTML = `
          ${p && state.r2.stage !== 'IDLE' ? `
            <div style="background: rgba(18,7,34,0.85); padding: 12px 16px; border-radius: var(--radius-base); border: 1.5px solid var(--c-primary); margin-bottom: 12px; text-align: left; width: 100%;">
              <div style="font-size: 0.85rem; color: var(--c-tertiary); font-weight: bold; margin-bottom: 2px;">
                MẢNH GHÉP ${state.r2.pieceIndex + 1}: ${p.title} (+20đ / 10đ)
              </div>
              <div style="font-size: 1.05rem; color: #ffffff; font-weight: bold; line-height: 1.4;">
                ${p.question}
              </div>
            </div>
          ` : ''}

          <div class="r2-buzzer-grid">
            <button class="dual-buzzer-btn btn-piece-buzzer ${isPieceBuzzerOpen && !team.locked ? 'btn-buzzer-ready' : 'btn-buzzer-waiting'}" 
                    onclick="handleBuzzerClick('PIECE')">
              <svg class="ui-icon" style="width: 28px; height: 28px; stroke: #fff;" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
                <line x1="15" y1="3" x2="15" y2="21"></line>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="3" y1="15" x2="21" y2="15"></line>
              </svg>
              <div>
                <div style="font-weight: bold;">CHUÔNG MẢNH GHÉP</div>
                <div style="font-size: 0.85rem; opacity: 0.9;">Giành quyền mở mảnh (+20đ)</div>
              </div>
            </button>

            <button class="dual-buzzer-btn btn-keyword-buzzer ${!team.keywordLocked && !state.r2.keywordSolved ? 'btn-buzzer-ready' : 'btn-buzzer-waiting'}"
                    onclick="handleBuzzerClick('KEYWORD')">
              <svg class="ui-icon" style="width: 28px; height: 28px; stroke: var(--c-neutral);" viewBox="0 0 24 24">
                <circle cx="7.5" cy="15.5" r="5.5"></circle>
                <path d="m21 2-9.6 9.6"></path>
                <path d="m15.5 7.5 3 3L22 7l-3-3"></path>
              </svg>
              <div>
                <div style="font-weight: bold;">CHUÔNG TỪ KHÓA</div>
                <div style="font-size: 0.85rem; opacity: 0.9;">Giải mã toàn bộ tranh (+100đ)</div>
              </div>
            </button>
          </div>
          ${team.keywordLocked ? `
            <div style="color: var(--c-secondary); font-size: 0.9rem; text-align: center; margin-top: 10px;">
              Đội bạn đã mất quyền bấm chuông từ khóa trong Vòng 2 do đoán sai trước đó.
            </div>
          ` : ''}
        `;
        return;
      }

      // 4. ROUND 3 — Cược Điểm & Về Đích
      if (state.status === 'ROUND3_BET') {
        if (state.r3.stage === 'BETTING') {
          statusCard.innerHTML = `<span style="color: var(--c-surface); font-weight: bold;">ĐẶT CƯỢC: CÒN ${state.r3.betTimeLeft || 10} GIÂY!</span>`;

          const maxPoints = team.score;
          const isConfirmed = state.r3.bets[myTeamId] !== undefined;

          canvas.innerHTML = `
            <div class="wager-box">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 1rem; color: #cbd5e1;">Mức cược đang chọn:</span>
                <span style="font-size: 2rem; font-weight: 700; color: var(--c-surface);" id="wagerDisplay">
                  ${selectedWager} đ
                </span>
              </div>

              <input type="range" class="wager-slider" id="wagerSliderInput" min="0" max="${maxPoints}" value="${selectedWager}" 
                     oninput="updateWagerValue(this.value)">

              <div class="chips-row">
                <button class="chip-btn" onclick="setWagerQuick(0)">0đ</button>
                <button class="chip-btn" onclick="addWagerQuick(10)">+10đ</button>
                <button class="chip-btn" onclick="addWagerQuick(20)">+20đ</button>
                <button class="chip-btn" onclick="addWagerQuick(50)">+50đ</button>
                <button class="chip-btn" style="color: var(--c-secondary); font-weight: 900;" onclick="setWagerQuick(${maxPoints})">TẤT TAY</button>
              </div>

              <button class="btn btn-gold" style="width: 100%; padding: 14px; font-size: 1.2rem; margin-top: 8px;"
                      onclick="submitWager()">
                ${isConfirmed ? 'ĐÃ XÁC NHẬN (CẬP NHẬT)' : 'XÁC NHẬN CƯỢC'}
              </button>
            </div>
          `;
          return;
        }

        if (state.r3.stage === 'QUESTION' || state.r3.stage === 'ANSWERING') {
          const isMyTurn = state.r3.currentTurn === myTeamId;
          const otherR3Turn = state.r3.currentTurn && state.r3.currentTurn !== myTeamId;
          const ansTeam = otherR3Turn ? state.teams.find(t => t.id === state.r3.currentTurn) : null;
          const isMyTeamLocked = team?.locked || (state.r3.wrongTeams && state.r3.wrongTeams.includes(myTeamId));

          // Case 1: Lượt của đội tôi trả lời
          if (isMyTurn) {
            statusCard.innerHTML = `<span style="color: var(--c-tertiary); font-weight: bold;">LƯỢT CỦA BẠN TRẢ LỜI CÂU HỎI VỀ ĐÍCH! (${state.r3.timeLeft !== undefined && state.r3.timeLeft !== null ? state.r3.timeLeft : 45}s)</span>`;
            canvas.innerHTML = `
              <div style="width: 100%; text-align: center;">
                ${state.r3.question ? `
                  <div style="background: rgba(18,7,34,0.9); padding: 12px 16px; border-radius: var(--radius-base); border: 2px solid var(--c-secondary); margin-bottom: 12px; text-align: left;">
                    <div style="font-size: 0.85rem; color: var(--c-secondary); font-weight: bold; margin-bottom: 3px;">
                      CÂU HỎI QUYẾT ĐỊNH VẬN MỆNH
                    </div>
                    <div style="font-size: 1.15rem; color: #fff; font-weight: bold; line-height: 1.4;">
                      ${state.r3.question.question}
                    </div>
                  </div>
                ` : ''}
                <p style="color: var(--c-surface); font-size: 1.15rem; margin-bottom: 12px; font-weight: bold;">CHỌN ĐÁP ÁN QUYẾT ĐỊNH:</p>
                <div class="player-options-grid">
                  ${['A', 'B', 'C', 'D'].map((letter, idx) => `
                    <button class="player-opt-btn ${state.r3.selectedAnswer === idx ? 'selected' : ''}" onclick="selectAnswer(${idx})">
                      <span style="font-size: 2rem; color: var(--c-surface); font-weight: bold;">${letter}</span>
                      <span style="font-size: 0.9rem; color: #cbd5e1; text-align: center;">${state.r3.question?.options ? state.r3.question.options[idx].replace(/^[A-D]\.\s*/, '') : 'Phương án ' + letter}</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            `;
            return;
          }

          // Case 2: Đội tôi ĐÃ TRẢ LỜI SAI (BỊ KHÓA LƯỢT VĨNH VIỄN Ở CÂU NÀY)
          if (isMyTeamLocked) {
            statusCard.innerHTML = `<span style="color: #ef4444; font-weight: bold;">ĐỘI BẠN ĐÃ MẤT LƯỢT Ở CÂU HỎI NÀY!</span>`;
            canvas.innerHTML = `
              ${state.r3.question ? `
                <div style="background: rgba(18,7,34,0.85); padding: 12px 16px; border-radius: var(--radius-base); border: 1.5px solid #ef4444; margin-bottom: 12px; text-align: left; width: 100%;">
                  <div style="font-size: 0.85rem; color: #ef4444; font-weight: bold; margin-bottom: 2px;">CÂU HỎI QUYẾT ĐỊNH</div>
                  <div style="font-size: 1.05rem; color: #cbd5e1; line-height: 1.4;">${state.r3.question.question}</div>
                </div>
              ` : ''}
              <button class="big-buzzer-btn btn-buzzer-locked" onclick="showToast('⚠️ Đội bạn đã trả lời sai và bị mất quyền bấm chuông câu này!')">
                ${renderGoldenBellSvg(75)}
                <span class="buzzer-label" style="color: #94a3b8;">MẤT LƯỢT</span>
              </button>
              <div style="font-size: 0.95rem; color: #f87171; text-align: center; margin-top: 8px; font-weight: bold;">
                ⚠️ Bạn đã trả lời sai và bị trừ điểm cược. Quyền bấm chuông thuộc về các đội còn lại!
              </div>
            `;
            return;
          }

          // Case 3: Đội khác đang trả lời
          if (otherR3Turn) {
            statusCard.innerHTML = `<span style="color: var(--c-surface); font-weight: bold;">Đội ${ansTeam ? ansTeam.name : 'đối thủ'} đang trả lời (${state.r3.timeLeft !== undefined && state.r3.timeLeft !== null ? state.r3.timeLeft : 45}s)...</span>`;
            canvas.innerHTML = `
              ${state.r3.question ? `
                <div style="background: rgba(18,7,34,0.85); padding: 12px 16px; border-radius: var(--radius-base); border: 1.5px solid var(--c-secondary); margin-bottom: 12px; text-align: left; width: 100%;">
                  <div style="font-size: 0.85rem; color: var(--c-secondary); font-weight: bold; margin-bottom: 2px;">CÂU HỎI QUYẾT ĐỊNH</div>
                  <div style="font-size: 1.05rem; color: #ffffff; font-weight: bold; line-height: 1.4;">${state.r3.question.question}</div>
                </div>
              ` : ''}
              <button class="big-buzzer-btn btn-buzzer-waiting" onclick="handleBuzzerClick('NORMAL')">
                ${renderGoldenBellSvg(75)}
                <span class="buzzer-label">ĐỢI LƯỢT</span>
              </button>
              <div style="font-size: 1rem; color: var(--c-surface); text-align: center; margin-top: 8px;">
                Chuông sẽ mở lại cho đội bạn nếu đối thủ trả lời sai hoặc hết giờ.
              </div>
            `;
            return;
          }

          // Case 4: Chuông đang mở cho các đội còn lại
          statusCard.innerHTML = `<span style="color: var(--c-surface); font-weight: bold;">BẤM CHUÔNG ĐỂ GIÀNH QUYỀN TRẢ LỜI CÂU HỎI CUỐI!</span>`;
          canvas.innerHTML = `
            ${state.r3.question ? `
              <div style="background: rgba(18,7,34,0.85); padding: 12px 16px; border-radius: var(--radius-base); border: 1.5px solid var(--c-secondary); margin-bottom: 12px; text-align: left; width: 100%;">
                <div style="font-size: 0.85rem; color: var(--c-secondary); font-weight: bold; margin-bottom: 2px;">CÂU HỎI QUYẾT ĐỊNH</div>
                <div style="font-size: 1.05rem; color: #ffffff; font-weight: bold; line-height: 1.4;">${state.r3.question.question}</div>
              </div>
            ` : ''}
            <button class="big-buzzer-btn btn-buzzer-ready" onclick="handleBuzzerClick('NORMAL')">
              ${renderGoldenBellSvg(75)}
              <span class="buzzer-label">BẤM CHUÔNG</span>
            </button>
            <div style="font-size: 1rem; color: var(--c-surface); text-align: center; margin-top: 8px;">
              ⚡ Bấm nhanh để giành lượt trả lời câu hỏi quyết định!
            </div>
          `;
          return;
        }

        statusCard.innerHTML = `<span>ĐANG CHỜ HIỆU LỆNH CỦA MC...</span>`;
        canvas.innerHTML = `<div style="text-align: center; color: #cbd5e1;">Chú ý màn hình máy chiếu!</div>`;
        return;
      }

      // 5. FINALE — Lễ Vinh Danh
      if (state.status.startsWith('FINALE')) {
        const lb = state.finale.leaderboard;
        const myRank = lb.find(t => t.id === myTeamId);
        statusCard.innerHTML = `<span style="color: var(--c-surface); font-weight: bold;">KẾT QUẢ CHUNG CUỘC</span>`;
        canvas.innerHTML = `
          <div style="text-align: center; padding: 20px;">
            ${myRank && myRank.rank === 1 ? `
              <h2 style="font-size: 2.2rem; color: var(--c-surface); text-shadow: 2px 2px 0 var(--c-secondary); margin-top: 10px; font-weight: 900;">
                🏆 XIN CHÚC MỪNG QUÁN QUÂN!
              </h2>
            ` : (myRank && myRank.rank <= 3) ? `
              <h2 style="font-size: 2rem; color: var(--c-surface); margin-top: 10px; font-weight: bold;">
                🎉 CHÚC MỪNG ĐỘI ĐẠT HẠNG ${myRank.rank} (TOP 3)!
              </h2>
            ` : `
              <h2 style="font-size: 1.8rem; color: var(--c-surface); margin-top: 10px;">
                ĐỘI ĐẠT HẠNG ${myRank ? myRank.rank : '-'}
              </h2>
            `}
            <div style="font-size: 3.2rem; font-weight: 700; color: var(--c-surface); margin: 12px 0;">
              ${team.score} ĐIỂM
            </div>
            <p style="color: #cbd5e1; font-size: 1.1rem;">
              Xin mời toàn đội hướng mắt lên màn hình máy chiếu để cùng theo dõi Lễ trao giải Podium Top 3!
            </p>
          </div>
        `;
        return;
      }

      statusCard.innerHTML = `<span>TỔNG KẾT VÒNG THI</span>`;
      canvas.innerHTML = `
        <div style="text-align: center; color: #cbd5e1;">
          <p style="font-size: 1.1rem;">MC đang tổng kết điểm số trên màn hình chính.</p>
        </div>
      `;
    }

    // Responsive Click Handler with Instant Client Feedback & Clear Toasts
    function handleBuzzerClick(type = 'NORMAL') {
      if (!myTeamId) {
        showToast('⚠️ Bạn chưa chọn đội! Vui lòng chọn đội để thi đấu.');
        switchTeamPrompt();
        return;
      }

      const state = currentGameState;
      const team = state?.teams?.find(t => t.id === myTeamId);

      // Lobby state
      if (!state || state.status === 'LOBBY') {
        testBuzzer();
        return;
      }

      // Round 1
      if (state.status === 'ROUND1') {
        if (team?.locked) {
          showToast('⚠️ Đội bạn đã mất lượt trả lời câu hỏi này!');
          return;
        }
        if (state.r1.buzzerQueue?.some(b => b.teamId === myTeamId)) {
          const pos = state.r1.buzzerQueue.findIndex(b => b.teamId === myTeamId) + 1;
          showToast(`🔔 Bạn đã bấm chuông rồi (Hạng #${pos})! Vui lòng chờ MC.`);
          return;
        }
        if (state.r1.stage === 'QUESTION_OPEN') {
          showToast('⏳ MC đang đọc câu hỏi! Chuông sẽ mở ngay khi MC phát hiệu lệnh.');
          return;
        }
        if (state.r1.stage === 'ANSWERING') {
          const ansTeam = state.teams.find(t => t.id === state.r1.currentTurn);
          showToast(`🔔 Đội ${ansTeam ? ansTeam.name : 'đối thủ'} đang trả lời! Nếu sai, chuông sẽ mở lại.`);
          return;
        }
        if (state.r1.stage === 'REVEALED') {
          showToast('🔔 MC đã công bố đáp án câu hỏi này!');
          return;
        }
        if (state.r1.stage !== 'BUZZER_OPEN') {
          showToast('🔔 MC chưa mở chuông cho câu hỏi này!');
          return;
        }

        // BUZZER_OPEN: Trigger immediate buzz!
        executeBuzz('NORMAL');
        return;
      }

      // Round 2
      if (state.status === 'ROUND2') {
        if (type === 'KEYWORD') {
          if (team?.keywordLocked) {
            showToast('⚠️ Đội bạn đã đoán sai từ khóa trước đó nên bị khóa quyền đoán từ khóa!');
            return;
          }
          if (state.r2.keywordSolved) {
            showToast('🔔 Từ khóa chủ đề đã được giải mã!');
            return;
          }
          if (state.r2.keywordTurn) {
            showToast('🔔 Đang có đội giành quyền đoán từ khóa!');
            return;
          }
          executeBuzz('KEYWORD');
          return;
        }

        // Piece buzzer
        if (team?.locked) {
          showToast('⚠️ Đội bạn đã mất lượt ở mảnh ghép này!');
          return;
        }
        if (state.r2.stage !== 'PIECE_BUZZER') {
          showToast('⏳ Chuông mảnh ghép chưa mở!');
          return;
        }
        executeBuzz('PIECE');
        return;
      }

      // Round 3
      if (state.status === 'ROUND3_BET') {
        if (team?.locked || (state.r3.wrongTeams && state.r3.wrongTeams.includes(myTeamId))) {
          showToast('⚠️ Đội bạn đã trả lời sai và bị mất quyền trả lời câu hỏi này!');
          return;
        }
        if (state.r3.stage === 'ANSWERING') {
          const ansTeam = state.teams.find(t => t.id === state.r3.currentTurn);
          showToast(`🔔 Đội ${ansTeam ? ansTeam.name : 'đối thủ'} đang trả lời!`);
          return;
        }
        if (state.r3.stage !== 'QUESTION') {
          showToast('⏳ Đang chờ MC mở câu hỏi quyết định!');
          return;
        }
        executeBuzz('NORMAL');
        return;
      }

      // Other states
      showToast('🔔 Trận đấu đang ở giai đoạn tổng kết!');
    }

    function executeBuzz(buzzerType) {
      if (window.quizSound) window.quizSound.playBuzzer();
      if (navigator.vibrate) {
        try { navigator.vibrate([200, 80, 200]); } catch(e) {}
      }
      socket.emit('player_buzz', {
        teamId: myTeamId,
        buzzerType
      });
      showToast('⚡ BẤM CHUÔNG THÀNH CÔNG! ĐANG GỬI VỀ HỆ THỐNG...');
    }

    function selectAnswer(index) {
      if (!myTeamId) return;
      if (window.quizSound) window.quizSound.playTick();
      socket.emit('player_select_answer', {
        teamId: myTeamId,
        answerIndex: index
      });
      showToast(`✅ Đã chọn phương án ${['A', 'B', 'C', 'D'][index]}!`);
    }

    function updateWagerValue(val) {
      selectedWager = Math.floor(Number(val));
      const disp = document.getElementById('wagerDisplay');
      if (disp) disp.innerText = `${selectedWager} đ`;
    }

    function setWagerQuick(val) {
      selectedWager = Math.floor(Number(val));
      const slider = document.getElementById('wagerSliderInput');
      if (slider) slider.value = selectedWager;
      updateWagerValue(selectedWager);
    }

    function addWagerQuick(delta) {
      const team = currentGameState?.teams?.find(t => t.id === myTeamId);
      const maxPoints = team ? team.score : 0;
      selectedWager = Math.min(maxPoints, selectedWager + delta);
      const slider = document.getElementById('wagerSliderInput');
      if (slider) slider.value = selectedWager;
      updateWagerValue(selectedWager);
    }

    function submitWager() {
      if (!myTeamId) return;
      socket.emit('player_submit_wager', {
        teamId: myTeamId,
        wager: selectedWager
      });
      if (window.quizSound) window.quizSound.playWagerLock();
      showToast(`🔒 Đã xác nhận mức cược: ${selectedWager} điểm!`);
    }

    if (myTeamId) {
      joinTeam(myTeamId);
    }
  </script>
</body>
</html>
